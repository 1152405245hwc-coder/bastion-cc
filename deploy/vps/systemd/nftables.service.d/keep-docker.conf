[Service]
# Debian's stock ExecStop flushes every nftables table and can remove Docker's
# iptables-nft MASQUERADE rules. Only delete this project's named table.
ExecStop=
ExecStop=/bin/sh -c '/usr/sbin/nft add table inet ccrf_fw 2>/dev/null || true; /usr/sbin/nft delete table inet ccrf_fw 2>/dev/null || true'
